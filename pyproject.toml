[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "winsper"
version = "1.1.1"
description = "Windows-first, local push-to-talk dictation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "av>=11",
  "comtypes>=1.4",
  "faster-whisper>=1.1",
  "numpy>=2.0",
  "Pillow>=10.0",
  "pynput>=1.7",
  "PyAutoGUI>=0.9",
  "pyperclip>=1.9",
  "pystray>=0.19",
  "pywinauto>=0.6.9",
  "PySide6>=6.8",
  "PyYAML>=6.0",
  "sounddevice>=0.5",
]

[project.scripts]
winsper = "voicepilot.__main__:main"

[project.optional-dependencies]
parakeet = ["sherpa-onnx>=1.12"]
test = ["pytest>=8.3"]
dev = ["pytest>=8.3", "ruff>=0.12"]
release = ["build>=1.2", "pyinstaller>=6.14"]

[tool.setuptools.packages.find]
include = ["voicepilot*"]

[tool.setuptools.package-data]
voicepilot = [
  "assets/check-dark.svg",
  "assets/check-light.svg",
  "assets/chevron-down-dark.svg",
  "assets/chevron-down-light.svg",
  "assets/winsper-app-icon.png",
  "assets/winsper-icon.png",
  "assets/winsper-logo.png",
  "assets/apps/outlook.svg",
  "assets/apps/slack.png",
  "assets/apps/chatgpt.png",
  "assets/apps/vscode.png",
  "assets/apps/terminal.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "hardware: opt-in tests that use real Windows hardware, global input, or foreground UI",
]

[tool.ruff]
target-version = "py312"
line-length = 140
