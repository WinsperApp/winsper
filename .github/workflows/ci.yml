name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - name: Audit locked Python dependencies
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\audit"
          $auditPython = "$env:RUNNER_TEMP\audit\Scripts\python.exe"
          & $auditPython -m pip install pip-audit==2.10.1
          if ($LASTEXITCODE -ne 0) { throw "Python audit tool installation failed." }
          & $auditPython -m pip_audit -r requirements-lock.txt --no-deps --disable-pip
          if ($LASTEXITCODE -ne 0) { throw "Python dependency audit failed." }
      - run: python -m ruff check .
      - run: python scripts/check_architecture.py
      - run: python -m compileall -q voicepilot tests
      - run: python -m pytest -q -m "not hardware"
        env:
          QT_QPA_PLATFORM: offscreen
          LOCALAPPDATA: ${{ runner.temp }}
      - name: Production application-action soak
        run: python -m devtools.runtime_soak --output artifacts/certification/runtime-soak.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-soak-${{ github.sha }}
          path: artifacts/certification/runtime-soak.json
          if-no-files-found: error
