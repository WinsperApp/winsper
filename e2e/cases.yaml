  # Guided certification: never use production conversations or documents.
  - id: guided-notepad-baseline
    suite: guided
    category: app-notepad
    kind: guided
    gate: text-delivery
    title: Notepad baseline dictation
    instructions: Open a blank Notepad file, dictate a two-sentence message, and verify exact insertion plus clipboard restoration.
    expected: Correct target receives all text; History saves it; clipboard is restored.

  - id: guided-terminal-paste
    suite: guided
    category: app-terminal
    kind: guided
    gate: text-delivery
    title: Windows Terminal safe paste
    instructions: Open a harmless PowerShell prompt and dictate "echo Winsper test" without executing it.
    expected: Command text appears using terminal-safe paste and is not executed.

  - id: guided-gmail-paragraphs
    suite: guided
    category: app-gmail
    kind: guided
    gate: text-delivery
    title: Gmail draft paragraphs
    instructions: Use a disposable draft. Dictate greeting, new paragraph, body, new paragraph, and signoff. Do not send.
    expected: Paragraphs and names are preserved in the draft; nothing is sent.

  - id: guided-google-docs-selection
    suite: guided
    category: app-google-docs
    kind: guided
    gate: selection-safety
    title: Google Docs selected-text Polish
    instructions: In a disposable document, select a paragraph and say "make it shorter".
    expected: Only the selection is replaced; protected facts remain unchanged.

  - id: guided-slack-enter
    suite: guided
    category: app-slack
    kind: guided
    gate: action-safety
    title: Slack Enter behavior
    instructions: Use a private test channel. First test ordinary dictation, then trailing "press enter".
    expected: Ordinary dictation does not send; explicit trailing Enter sends exactly once.

  - id: guided-target-change
    suite: guided
    category: target-safety
    kind: guided
    gate: wrong-target
    title: Target changes during processing
    instructions: Start dictation in Notepad, switch to a blank browser field before completion, and inspect both targets.
    expected: Nothing is pasted into the new target; result is recoverable and a warning appears.

