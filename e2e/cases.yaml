  # Offline ASR corpus. Record these WAV files using e2e/README.md.
  - id: asr-first-word
    suite: asr
    category: first-word
    kind: asr
    gate: first-word-capture
    language: en
    audio: audio/first-word-winsper.wav
    expected: Winsper should capture the very first word.
    protected: [Winsper]

  - id: asr-technical
    suite: asr
    category: technical
    kind: asr
    gate: protected-terms
    language: en
