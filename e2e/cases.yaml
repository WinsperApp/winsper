  # Polish is scored by constraints, not one exact stylistic sentence.
  - id: polish-correct-name
    suite: polish
    category: self-correction
    kind: polish
    gate: cancelled-thought-leak
    input: Please ask Ankit to review this, sorry I mean Akshay.
    must_include: [Akshay, review]
    must_exclude: [Ankit, sorry]
    protected: [Akshay]

  - id: polish-correct-date
    suite: polish
    category: self-correction
    kind: polish
    gate: cancelled-thought-leak
    input: Let's schedule it for Monday, actually Tuesday works better.
    must_include: [Tuesday]
    must_exclude: [Monday]
    protected: [Tuesday]

  - id: polish-correct-number
    suite: polish
    category: self-correction
    kind: polish
    gate: protected-facts
    input: The estimate is 15 lakhs, sorry 18 lakhs.
    must_include: [18 lakhs]
    must_exclude: [15 lakhs]
    protected: [18 lakhs]

  - id: polish-correct-contrast
    suite: polish
    category: self-correction
    kind: polish
    gate: cancelled-thought-leak
    input: I think my cat sat on the mat. Not my cat, but my dog sat on the mat.
    must_include: [dog, sat, mat]
    must_exclude: [cat, not my cat]
    protected: [dog]

  - id: polish-correct-i-mean
    suite: polish
    category: self-correction
    kind: polish
    gate: cancelled-thought-leak
    input: Please ask Ankit to review this, I mean Akshay.
    must_include: [Akshay, review]
    must_exclude: [Ankit, I mean]
    protected: [Akshay]

  - id: polish-correct-second-thought
    suite: polish
    category: self-correction
    kind: polish
    gate: cancelled-thought-leak
    input: Send the draft tonight. On second thought, send it tomorrow morning.
    must_include: [tomorrow morning]
    must_exclude: [tonight, second thought]

  - id: polish-cancel-harsh-thought
    suite: polish
    category: self-correction
    kind: polish
    gate: cancelled-thought-leak
    input: Can you tell him that I am unhappy with the work, no don't say that, just say we need to improve the quality.
    must_include: [improve the quality]
    must_exclude: [unhappy]

  - id: polish-correct-no-wait
    suite: polish
    category: self-correction
    kind: polish
    gate: cancelled-thought-leak
    input: Send this to Rahul, no wait, send this to Priya.
    must_include: [Priya]
    must_exclude: [Rahul, no wait]
    protected: [Priya]

  - id: polish-correct-change-that
    suite: polish
    category: self-correction
    kind: polish
    gate: cancelled-thought-leak
    input: Schedule it for Monday, change that to Tuesday.
    must_include: [Tuesday]
    must_exclude: [Monday, change that]
    protected: [Tuesday]

  - id: polish-correct-scratch-that
    suite: polish
    category: self-correction
    kind: polish
    gate: cancelled-thought-leak
    input: Send the draft tonight. Scratch that, send it tomorrow morning.
    must_include: [tomorrow morning]
    must_exclude: [tonight, scratch that]

  - id: polish-correct-start-over
    suite: polish
    category: self-correction
    kind: polish
    gate: cancelled-thought-leak
    input: The release is blocked. Start over, the release is ready for review.
    must_include: [ready for review]
    must_exclude: [blocked, start over]

  - id: polish-question-remains-question
    suite: polish
    category: intent-preservation
    kind: polish
    gate: intent-preservation
    input: What is the status of the deployment?
    must_include: [status, deployment]
    intent: question

  - id: polish-request-remains-request
